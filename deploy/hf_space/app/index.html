<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniGPT-X Story Generator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --output-bg: #f1f5f9;
      --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --output-bg: #090d16;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header span { font-size: 0.85rem; color: var(--text-muted); }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label { font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.25rem; }
    textarea {
      width: 100%;
      height: 90px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .examples span { font-size: 0.8rem; color: var(--text-muted); }
    .chip {
      background: var(--output-bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
    }
    .chip:hover { border-color: var(--primary); }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }
    .control-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .control-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    input[type=range] { width: 100%; accent-color: var(--primary); }
    .actions { display: flex; gap: 0.75rem; }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .output-box {
      background: var(--output-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      min-height: 140px;
      max-height: 400px;
      overflow-y: auto;
      font-family: var(--code-font);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MiniGPT-X</h1>
      <span id="modelInfo">Loading model info...</span>
    </header>

    <div class="card">
      <div>
        <label for="promptInput">Story Prompt</label>
        <textarea id="promptInput">Once upon a time, there was a little bird named Pip.</textarea>
      </div>

      <div class="examples">
        <span>Try an example:</span>
        <button type="button" class="chip" onclick="setPrompt('Once upon a time, there was a little rabbit who loved carrots.')">Little Rabbit</button>
        <button type="button" class="chip" onclick="setPrompt('Lily and her dog Max were walking through a sunny forest.')">Forest Walk</button>
        <button type="button" class="chip" onclick="setPrompt('Tom had a shiny toy car that could drive very fast.')">Toy Car</button>
      </div>

      <div class="controls">
        <div class="control-item">
          <div class="control-header"><span>Temperature</span><span id="tempVal">0.8</span></div>
          <input type="range" id="tempInput" min="0.0" max="1.5" step="0.05" value="0.8" oninput="document.getElementById('tempVal').innerText=this.value">
        </div>
        <div class="control-item">
          <div class="control-header"><span>Top-K</span><span id="topkVal">50</span></div>
          <input type="range" id="topkInput" min="0" max="100" step="5" value="50" oninput="document.getElementById('topkVal').innerText=this.value">
        </div>
        <div class="control-item">
          <div class="control-header"><span>Top-P</span><span id="toppVal">0.9</span></div>
          <input type="range" id="toppInput" min="0.1" max="1.0" step="0.05" value="0.9" oninput="document.getElementById('toppVal').innerText=this.value">
        </div>
        <div class="control-item">
          <div class="control-header"><span>Max Tokens</span><span id="maxTokensVal">120</span></div>
          <input type="range" id="maxTokensInput" min="20" max="300" step="10" value="120" oninput="document.getElementById('maxTokensVal').innerText=this.value">
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn" class="btn-primary" onclick="startGeneration()">Generate Story</button>
        <button id="stopBtn" class="btn-secondary" onclick="stopGeneration()" disabled>Stop</button>
      </div>
    </div>

    <div class="card">
      <label>Story Output</label>
      <div id="outputArea" class="output-box">Press "Generate Story" to create a new tale...</div>
    </div>
  </div>

  <script>
    let abortController = null;

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    async function loadInfo() {
      try {
        const res = await fetch('/info');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('modelInfo').innerText = 
            `${(data.total_parameters / 1e6).toFixed(1)}M params • ${data.device.toUpperCase()}`;
        }
      } catch (e) {
        document.getElementById('modelInfo').innerText = 'Backend ready';
      }
    }
    loadInfo();

    async function startGeneration() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt.trim()) return;

      const temp = parseFloat(document.getElementById('tempInput').value);
      const topK = parseInt(document.getElementById('topkInput').value);
      const topP = parseFloat(document.getElementById('toppInput').value);
      const maxTokens = parseInt(document.getElementById('maxTokensInput').value);

      const out = document.getElementById('outputArea');
      out.innerText = prompt;
      
      const genBtn = document.getElementById('generateBtn');
      const stopBtn = document.getElementById('stopBtn');
      genBtn.disabled = true;
      stopBtn.disabled = false;

      abortController = new AbortController();

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            temperature: temp,
            top_k: topK,
            top_p: topP,
            max_new_tokens: maxTokens,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!res.ok) {
          const err = await res.text();
          out.innerText += '\n\n[Error: ' + err + ']';
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const jsonStr = line.slice(6);
              try {
                const parsed = JSON.parse(jsonStr);
                if (parsed.token) {
                  out.innerText += parsed.token;
                  out.scrollTop = out.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          out.innerText += '\n\n[Request failed: ' + e.message + ']';
        }
      } finally {
        genBtn.disabled = false;
        stopBtn.disabled = true;
        abortController = null;
      }
    }

    function stopGeneration() {
      if (abortController) {
        abortController.abort();
      }
    }
  </script>
</body>
</html>
