# Model configuration (Tiny Smoke Test)
model:
  n_layer: 2
  n_head: 4
  n_embd: 128
  block_size: 256
  dropout: 0.0
  vocab_size: 4096
  use_rope: true
  norm_type: "rmsnorm"
  activation: "swiglu"
  use_sdpa: true
  tie_embeddings: true

# Training hyperparameters
training:
  batch_size: 16
  grad_accum_steps: 1
  learning_rate: 0.001
  min_lr: 0.0001
  weight_decay: 0.1
  max_iters: 200
  warmup_iters: 20
  eval_interval: 50
  eval_iters: 20
  grad_clip: 1.0
  seed: 1337
  checkpoint_every: 50

# Dataset configuration
data:
  dataset: "tinystories"
  train_split: 0.9
  tokenizer_path: "tokenizer/bpe_4096.json"

device: "auto"

