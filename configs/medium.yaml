# Model configuration
model:
  n_layer: 6           # Number of Transformer blocks (layers)
  n_head: 6            # Number of attention heads in multi-head attention
  n_embd: 384          # Embedding dimension size (channels per token)
  block_size: 256      # Maximum sequence context window length in tokens
  dropout: 0.1         # Dropout probability applied during training
  vocab_size: null     # Vocabulary size (TBD until the BPE tokenizer is trained)
  use_rope: true       # Use Rotary Position Embeddings (RoPE) instead of absolute embeddings
  norm_type: "rmsnorm" # Normalization layer type: 'rmsnorm' or 'layernorm'
  activation: "swiglu" # Feed-forward activation function: 'swiglu' or 'relu'
  use_sdpa: true       # Use PyTorch scaled_dot_product_attention (Flash/Fused kernel)
  tie_embeddings: true # Share weights between input embedding and final lm_head projection

# Training hyperparameters
training:
  batch_size: 8          # Number of sequences per micro-batch
  grad_accum_steps: 1    # Number of micro-batches to accumulate before optimizer step
  learning_rate: 0.001   # Peak learning rate for AdamW optimizer
  min_lr: 0.0001         # Minimum learning rate reached at the end of cosine decay
  weight_decay: 0.1      # Weight decay regularization coefficient for 2D weight tensors
  max_iters: 5000        # Total number of training iterations (optimizer steps)
  warmup_iters: 100      # Number of linear warmup steps from 0 to peak learning rate
  eval_interval: 250     # How often (in iterations) to evaluate validation loss
  eval_iters: 50         # Number of batches to average over during validation evaluation
  grad_clip: 1.0         # Maximum gradient norm threshold for gradient clipping
  seed: 1337             # Random seed for reproducible dataset shuffling and weight init
  checkpoint_every: 1000 # Save model checkpoint interval (in iterations)

# Dataset configuration
data:
  dataset: "tinystories"                       # Dataset name or identifier
  train_split: 0.9                             # Proportion of data used for training vs validation
  tokenizer_path: "data/processed/bpe.model"   # Path to trained tokenizer model file

# Execution hardware
device: "auto" # Target hardware device: 'auto' (prefers 'mps' then 'cuda' then 'cpu')
